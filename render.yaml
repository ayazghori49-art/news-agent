services:
  - type: web
    name: ai-news-digest
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 2"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SERPAPI_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
